name: Daily Email Organization

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC = 09:00 CEST / 08:00 CET
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Required to commit data/ changes and deploy to Pages

jobs:
  - name: Set up Node.js 20
  uses: actions/setup-node@v3
  with:
    node-version: '20'
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Need full history for commits

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct credentials from secrets
        run: |
          cat > credentials.json << 'EOF'
          {
            "installed": {
              "client_id": "${{ secrets.GMAIL_CLIENT_ID }}",
              "client_secret": "${{ secrets.GMAIL_CLIENT_SECRET }}",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "redirect_uris": ["http://localhost"]
            }
          }
          EOF

      - name: Run email organizer
        env:
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_USER_EMAIL: ${{ secrets.GMAIL_USER_EMAIL }}
        run: |
          python src/main.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit data changes
        run: |
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update processed IDs and mappings [$(date -u +'%Y-%m-%d')]"
            git push
          else
            echo "No data changes to commit"
          fi

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          force_orphan: true

      - name: Notify on failure (optional webhook)
        if: failure()
        run: |
          if [ -n "${{ secrets.NTFY_TOPIC }}" ]; then
            curl -X POST "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" \
              -H "Title: Email Organizer Failed" \
              -d "Daily run failed at $(date). Check GitHub Actions for details."
          fi
