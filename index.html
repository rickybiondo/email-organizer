<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Organizer Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>📧 Email Organizer</h1>
            <p class="subtitle">Daily Classification Briefing</p>
            <div class="last-updated" id="lastUpdated">Loading...</div>
        </div>
    </header>

    <main class="main">
        <!-- Summary Cards -->
        <section class="summary-section">
            <div class="card" id="cardProcessed">
                <div class="card-icon">📥</div>
                <div class="card-info">
                    <div class="card-value" id="valProcessed">--</div>
                    <div class="card-label">Processed</div>
                </div>
            </div>
            <div class="card" id="cardClassified">
                <div class="card-icon">🏷️</div>
                <div class="card-info">
                    <div class="card-value" id="valClassified">--</div>
                    <div class="card-label">Classified</div>
                </div>
            </div>
            <div class="card" id="cardLabelsApplied">
                <div class="card-icon">✨</div>
                <div class="card-info">
                    <div class="card-value" id="valLabelsApplied">--</div>
                    <div class="card-label">Labels Applied</div>
                </div>
            </div>
            <div class="card" id="cardUnclassified">
                <div class="card-icon">❓</div>
                <div class="card-info">
                    <div class="card-value" id="valUnclassified">--</div>
                    <div class="card-label">Need Review</div>
                </div>
            </div>
        </section>

        <!-- Chart -->
        <section class="chart-section">
            <div class="card chart-card">
                <h2>Label Distribution</h2>
                <div class="chart-container">
                    <canvas id="labelChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Email Sections -->
        <section class="sections-container" id="sectionsContainer">
            <!-- Dynamically populated -->
        </section>
    </main>

    <footer class="footer">
        <p>Generated by <a href="https://github.com" target="_blank">Email Organizer</a> · 
        <span id="footerDate"></span></p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            // Auto-refresh every 5 minutes
            setInterval(loadDashboard, 5 * 60 * 1000);
        });
    </script>
</body>
</html>
